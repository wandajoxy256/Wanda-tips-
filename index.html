<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanda Tips</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: #00ffcc;
            margin-top: 10px;
            margin-bottom: 20px;
            font-weight: 800;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #00ffcc;
            font-weight: 600;
            text-transform: uppercase;
        }
        input, select, button {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .preset-container {
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
        }
        .preset-btn {
            background-color: #262626;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: bold;
        }
        .preset-btn:active {
            background-color: #00ffcc;
            color: #121212;
        }
        button.action-btn {
            background-color: #00b33c;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button.action-btn:active {
            background-color: #00802b;
        }
        button.vision-btn {
            background-color: #007acc;
        }
        button.vision-btn:active {
            background-color: #005999;
        }
        #results {
            background-color: #181818;
            padding: 14px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #00ff66;
            border: 1px solid #282828;
            min-height: 120px;
        }
    </style>
</head>
<body>

    <h1>WANDA TIPS</h1>

    <!-- Bankroll Management Card -->
    <div class="card">
        <label for="bankrollInput">Starting Bankroll / Stake Base (Units):</label>
        <input type="number" id="bankrollInput" value="1000" placeholder="Enter bankroll amount...">
        
        <div class="preset-container">
            <button class="preset-btn" onclick="setBankroll(500)">500</button>
            <button class="preset-btn" onclick="setBankroll(1000)">1,000</button>
            <button class="preset-btn" onclick="setBankroll(5000)">5,000</button>
            <button class="preset-btn" onclick="setBankroll(50000)">50,000</button>
        </div>
    </div>

    <!-- API Settings Card -->
    <div class="card">
        <label for="apiKey">Gemini API Key (For Screenshot AI):</label>
        <input type="password" id="apiKey" placeholder="Paste free Gemini API key...">
    </div>

    <!-- Vision AI Analysis Card -->
    <div class="card">
        <label for="imageInput">Upload Match Screenshot:</label>
        <input type="file" id="imageInput" accept="image/*">
        <button class="action-btn vision-btn" onclick="analyzeScreenshot()">Scan Screenshot with Vision AI</button>
    </div>

    <!-- Local Mathematical Model Card -->
    <div class="card">
        <label for="scope">Active League Scope:</label>
        <select id="scope">
            <option value="ALL">ALL LEAGUES</option>
            <option value="EPL">English Premier League</option>
            <option value="LaLiga">Spanish LaLiga</option>
            <option value="SerieA">Italian Serie A</option>
        </select>
        <button class="action-btn" onclick="runScan()">Run Feasible Market Scan</button>
    </div>

    <!-- Results Output Area -->
    <div id="results">Wanda Tips ready. Set your bankroll above and tap an analysis mode to start...</div>

    <script>
        // Store API key locally on device
        document.getElementById('apiKey').value = localStorage.getItem('wanda_api_key') || '';
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('wanda_api_key', e.target.value);
        });

        function setBankroll(amount) {
            document.getElementById('bankrollInput').value = amount;
        }

        function getBankroll() {
            const val = parseFloat(document.getElementById('bankrollInput').value);
            return isNaN(val) || val <= 0 ? 1000 : val;
        }

        function factorial(n) {
            return n <= 1 ? 1 : n * factorial(n - 1);
        }

        function poisson(lmbda, k) {
            return (Math.exp(-lmbda) * Math.pow(lmbda, k)) / factorial(k);
        }

        function runScan() {
            const scope = document.getElementById("scope").value;
            const bankroll = getBankroll();

            const database = {
                "EPL": [
                    {home: "Newcastle United", away: "Everton FC", o1: 2.30, o2: 3.02, over: 1.75},
                    {home: "Arsenal", away: "Chelsea", o1: 2.10, o2: 3.20, over: 1.85}
                ],
                "LaLiga": [
                    {home: "Real Madrid", away: "Barcelona", o1: 2.00, o2: 3.10, over: 1.80}
                ],
                "SerieA": [
                    {home: "Juventus", away: "Inter Milan", o1: 2.20, o2: 3.10, over: 1.90}
                ]
            };

            let targetLeagues = scope === "ALL" ? Object.keys(database) : [scope];
            let report = `WANDA TIPS REPORT (Bankroll: ${bankroll.toLocaleString()} units)
` + "=".repeat(40) + "

";

            targetLeagues.forEach(league => {
                let fixtures = database[league] || [];
                report += `[${league}]
`;

                fixtures.forEach(fx => {
                    let avg_h = 1.60, avg_a = 1.25;
                    let hw = 0, dr = 0, aw = 0, ov = 0;

                    for (let h = 0; h < 6; h++) {
                        for (let a = 0; a < 6; a++) {
                            let p = poisson(avg_h, h) * poisson(avg_a, a);
                            if (h > a) hw += p;
                            else if (h === a) dr += p;
                            else aw += p;
                            if ((h + a) > 2.5) ov += p;
                        }
                    }

                    let hw_p = hw * 100, aw_p = aw * 100, ov_p = ov * 100;
                    let dc_1x = (hw + dr) * 100;

                    let markets = [
                        {name: "Home Win (1)", prob: hw_p / 100, odds: fx.o1},
                        {name: "Away Win (2)", prob: aw_p / 100, odds: fx.o2},
                        {name: "Over 2.5 Goals", prob: ov_p / 100, odds: fx.over},
                        {name: "Double Chance [1X]", prob: dc_1x / 100, odds: 1.35}
                    ];

                    let bestPick = "None";
                    let bestStakeAmt = 0;
                    let bestPct = 0;
                    let topScore = 0;

                    markets.forEach(m => {
                        let b = m.odds - 1.0;
                        let q = 1.0 - m.prob;
                        let fullKelly = b > 0 ? (b * m.prob - q) / b : 0;
                        let quarterKelly = Math.max(0, fullKelly * 0.25);
                        
                        let implied = (1 / m.odds) * 100;
                        let edge = (m.prob * 100) - implied;
                        let score = (m.prob * 100) + (edge * 2.5);

                        if (score > topScore && quarterKelly > 0) {
                            topScore = score;
                            bestPick = m.name;
                            bestPct = quarterKelly * 100;
                            bestStakeAmt = bankroll * quarterKelly;
                        }
                    });

                    report += ` • ${fx.home} vs ${fx.away}
`;
                    if (bestStakeAmt > 0) {
                        report += `   🎯 FEASIBLE PICK: ${bestPick}
`;
                        report += `   💰 Rec. Stake: ${bestPct.toFixed(1)}% (${Math.round(bestStakeAmt).toLocaleString()} units)
`;
                    } else {
                        report += `   ⚪ No positive edge detected
`;
                    }
                    report += "-".repeat(34) + "
";
                });
            });

            document.getElementById("results").innerText = report;
        }

        async function analyzeScreenshot() {
            const key = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('imageInput');
            const resultsDiv = document.getElementById("results");
            const bankroll = getBankroll();

            if (!key) {
                alert("Please paste your Gemini Vision API key first.");
                return;
            }
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select or take a screenshot image first.");
                return;
            }

            resultsDiv.innerText = "Processing image through Vision AI Engine...
Please wait a few seconds...";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                
                const prompt = `Analyze this virtual football match screenshot. Extract visible teams, 1X2 odds, and total goals odds. Perform Poisson probability calculations and output Quarter-Kelly staking recommendations based on a bankroll of ${bankroll} units. List best feasible picks with explicit unit stakes.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inlineData: { mimeType: file.type, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        resultsDiv.innerText = `WANDA TIPS VISION REPORT (Bankroll: ${bankroll.toLocaleString()} units)
` + "=".repeat(40) + "

" + data.candidates[0].content.parts[0].text;
                    } else {
                        resultsDiv.innerText = "Error analyzing image. Please ensure your API key is valid.";
                    }
                } catch (err) {
                    resultsDiv.innerText = "Network Error: " + err.message;
                }
            };

            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
